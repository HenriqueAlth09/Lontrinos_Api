<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clube do Livro - Cadastro</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="cadastro-page">

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-header">
                <img
                    src="assets/logoLontrino.png"
                    alt="Logo Clube do Livro"
                    class="auth-logo"
                >

                <h1>
                    Junte-se ao Clube
                    <span class="dot"></span>
                </h1>

                <p>
                    Crie sua conta para participar das leituras
                </p>
            </div>

            <form id="cadastro-form">

                <div class="input-group">
                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Seu nome completo"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="apelido">Nome de usuário *</label>
                    <input type="text" id="apelido" name="apelido" placeholder="ex.: aliceleitora" minlength="3" maxlength="24" pattern="[A-Za-z0-9_.-]{3,24}" autocomplete="username" required>
                    <small>Seu @usuário aparecerá nos chats. Pode ser alterado a cada 30 dias.</small>
                </div>

                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="Somente números" inputmode="numeric" maxlength="14" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="senha">Criar Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="confirmar-senha">
                        Confirmar Senha
                    </label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="btn">
                    Cadastrar
                </button>

            </form>

            <div class="auth-footer">
                Já tem uma conta?
                <a href="login.html">Entrar</a>
            </div>

        </div>

    </main>

</body>
</html>
