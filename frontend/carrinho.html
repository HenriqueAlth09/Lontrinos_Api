<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Carrinho e favoritos - Lontrinos</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script><style>.pagina-carrinho{max-width:1100px;margin:50px auto;padding:0 20px;min-height:55vh}.lista-carrinho{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}.item-carrinho{background:#fff;border:1px solid var(--cor-borda);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}.item-carrinho img{width:100%;height:180px;object-fit:cover;border-radius:9px}.item-carrinho button{padding:10px;border:0;border-radius:8px;background:var(--cor-vinho);color:#fff;cursor:pointer}.carrinho-vazio{padding:35px 0}.header-icon{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--cor-branco);font-size:25px;text-decoration:none;cursor:pointer;padding:4px}</style></head><body><header class="site-header">
<a class="logo-area" href="index.html"><img src="assets/logoLontrino.png" alt="Logo Lontrinos"><span> LONTRINOS <small>CLUBE DO LIVRO</small></span></a>
<nav class="menu-navegacao"><a href="index.html" data-page="index.html" class="">HOME</a><a href="sobre.html" data-page="sobre.html" class="">SOBRE NÓS</a><a href="livros.html" data-page="livros.html" class="">LIVROS</a><a href="resenhas.html" data-page="resenhas.html" class="">RESENHAS</a><a href="clube.html" data-page="clube.html" class="">CLUBE</a><a href="chat.html" data-page="chat.html" class="">CHAT</a><a href="loja.html" data-page="loja.html" class="">LOJA</a><a href="planos.html" data-page="planos.html" class="">PLANOS</a><a href="perfil.html" data-page="perfil.html" class="">PERFIL</a></nav>
<div class="header-itens"><button class="header-icon" id="btnBusca" type="button" aria-label="Pesquisar" title="Pesquisar"><img src="assets/icon-busca.svg" alt="PESQUISAR"></button><a class="header-icon" href="carrinho.html" aria-label="Carrinho" title="Carrinho"><img src="assets/icon-carrinho.svg" alt="CARRINHO"></a><a class="header-icon" href="perfil.html" aria-label="Perfil" title="Perfil"><img class="perfil" src="assets/user.jpg" alt="PERFIL"></a></div>
</header><main class="pagina-carrinho"><h1>Meu carrinho e favoritos</h1><p>Os produtos favoritados e adicionados ao carrinho ficam salvos neste navegador.</p><div id="listaCarrinho" class="lista-carrinho"></div><p id="carrinhoVazio" class="carrinho-vazio">Você ainda não adicionou produtos. <a href="loja.html">Explorar a loja</a></p></main><script>document.addEventListener('DOMContentLoaded',()=>{const key='lontrinosCarrinho',favKey='lontrinosFavoritos',list=document.getElementById('listaCarrinho'),empty=document.getElementById('carrinhoVazio');let items=JSON.parse(localStorage.getItem(key)||'[]'),favs=JSON.parse(localStorage.getItem(favKey)||'[]');const all=[...items.map(x=>({...x,tipo:'Carrinho'})),...favs.filter(f=>!items.some(x=>x.nome===f.nome)).map(x=>({...x,tipo:'Favorito'}))];empty.hidden=all.length>0;all.forEach((item,i)=>{const card=document.createElement('article');card.className='item-carrinho';card.innerHTML=`<img src="${item.imagem}" alt=""><small>${item.tipo}</small><h3>${item.nome}</h3><p>${item.preco}</p><button type="button">${item.tipo==='Carrinho'?'Remover do carrinho':'Remover dos favoritos'}</button>`;card.querySelector('button').addEventListener('click',()=>{const arr=item.tipo==='Carrinho'?items:favs;const idx=arr.findIndex(x=>x.nome===item.nome);if(idx>=0)arr.splice(idx,1);localStorage.setItem(item.tipo==='Carrinho'?key:favKey,JSON.stringify(arr));location.reload()});list.appendChild(card)})});</script></body></html>
